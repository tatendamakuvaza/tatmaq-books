name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke test (auth, roles, tenancy, ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: python3 tests/smoke_test.py

      - name: Check the app boots under gunicorn
        run: |
          gunicorn app:app --bind 127.0.0.1:8000 --workers 1 --timeout 30 &
          sleep 4
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/login
          kill %1
